name: Update profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update activity feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_activity.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No activity changes."
            exit 0
          fi

          git config user.name "siwoo-system[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update profile activity"
          git push
